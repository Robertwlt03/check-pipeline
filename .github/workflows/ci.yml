# Runs check-pipeline on itself on every pull request and on main: the steps that need nothing but
# Python on Ubuntu, the spelling and the samples (which build a Swift package) on a Mac. A last job
# makes sure the README's pictures match their descriptions.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the code; GitHub's token gets no right to change anything.
permissions:
  contents: read

# A newer push replaces the run of an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, which nobody can move; Dependabot proposes newer ones.
jobs:
  checks:
    name: ${{ matrix.group }}
    runs-on: ${{ matrix.group == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [linux, macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the commits step compares with the base branch
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e .
      - name: The group's steps
        run: check-pipeline ${{ matrix.group }}

  pictures:
    name: Pictures are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install markdown-graphics
        run: python -m pip install "git+https://github.com/Robertwlt03/markdown-graphics@v0.1.0"
      # git status also sees pictures that were never committed, which git diff would miss.
      - name: Draw and compare
        run: |
          markdown-graphics pictures
          git status --porcelain -- assets/pictures
          test -z "$(git status --porcelain -- assets/pictures)"
